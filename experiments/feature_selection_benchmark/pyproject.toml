[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature_selection_benchmark"
version = "0.1.0"
description = "Benchmark of feature selection methods: runs filter / wrapper / embedded / SHAP-based methods and returns a ranked leaderboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DmDSLab" },
]
keywords = ["feature-selection", "benchmark", "machine-learning", "automl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies — `~=` (compatible release: allows patch/minor
# updates within the same major/minor, locks the rest).
dependencies = [
    "numpy~=1.26",
    "pandas~=2.2",
    "scikit-learn~=1.4",
    "joblib~=1.3",
    "tqdm~=4.66",
    "tqdm_joblib~=0.0.4",
]

[project.optional-dependencies]
# FS-method extras — heavy ML packages, kept optional so the core scaffold
# installs without them. `~=` operator (compatible release).
methods = [
    "shap~=0.45",
    "catboost~=1.2",
    "BorutaShap~=1.0",
    "mrmr-selection~=0.2",
    "target-permutation-importances~=2.1",
]
# Development tooling — `>=` operator (safe to track fresh versions).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["feature_selection_benchmark*"]
namespaces = false
