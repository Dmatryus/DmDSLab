[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature_selection_benchmark"
version = "0.3.0"
description = "Benchmark of feature selection methods: runs filter / wrapper / embedded / SHAP-based methods and returns a ranked leaderboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DmDSLab" },
]
keywords = ["feature-selection", "benchmark", "machine-learning", "automl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies — `~=` (compatible release: allows patch/minor
# updates within the same major/minor, locks the rest).
dependencies = [
    "numpy~=1.26",
    "pandas~=2.2",
    "scikit-learn~=1.4",
    "optuna~=4.8",
    "joblib~=1.3",
    "tqdm~=4.66",
    "tqdm_joblib~=0.0.4",
]

[project.optional-dependencies]
# FS-method extras — heavy ML packages, kept optional so the core scaffold
# installs without them. `~=` operator (compatible release).
methods = [
    "shap~=0.45",
    "catboost~=1.2",
    "BorutaShap~=1.0",
    "mrmr-selection~=0.2",
    "target-permutation-importances~=2.1",
]
# Development tooling — `>=` operator (safe to track fresh versions).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["feature_selection_benchmark*"]
namespaces = false

# --- Linting & formatting -------------------------------------------------
# Ruff covers linting + import sorting (rule group `I`, replaces isort) +
# formatting. Target Python 3.10 to match `requires-python`.
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["feature_selection_benchmark", "tests"]

[tool.ruff.lint]
# E/W  — pycodestyle, F — pyflakes, I — isort (import sorting),
# UP   — pyupgrade, B — flake8-bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["feature_selection_benchmark"]

# --- Static type checking -------------------------------------------------
# Strictness tuned for the scaffold: stub bodies are `raise NotImplementedError`,
# so `no-implicit-reexport` / unreachable-style checks would yield false
# positives. `warn_no_return` is disabled because typed stubs declare a return
# type but never return — that is intentional at the scaffold stage (plan R-5).
[tool.mypy]
python_version = "3.10"
files = ["feature_selection_benchmark"]
ignore_missing_imports = true
warn_no_return = false
warn_unreachable = false
warn_return_any = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
